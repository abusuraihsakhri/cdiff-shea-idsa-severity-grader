version: '3.8'

services:
  cdiff-shea-idsa-severity-grader:
    build: .
    container_name: cdiff-shea-idsa-severity-grader
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=cdiff-shea-idsa-severity-grader-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
