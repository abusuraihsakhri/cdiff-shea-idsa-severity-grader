name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: python -m pip install "pytest>=8,<10"

      - name: Compile source
        run: python -m compileall -q cdiff_grader.py cli.py

      - name: Run test suite
        run: python -m pytest -v

      - name: Check browser JavaScript syntax
        run: node --check app.js

      - name: Verify CLI severity grading
        run: >
          python cli.py grade
          --wbc 18500
          --creatinine 1.8
          --age 68
          --albumin 2.9
          --json

      - name: Verify CLI ATLAS scoring
        run: >
          python cli.py atlas
          --age 74
          --wbc 19000
          --creatinine 2.0
          --albumin 2.3
          --abx
          --json

      - name: Verify CSV batch processing
        run: python cli.py batch --input sample.csv --output out_smoke.csv
